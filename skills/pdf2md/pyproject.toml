[project]
name = "pdf2md-skill"
version = "1.4.1"
description = "Convert PDFs to Markdown via the skale pdf API (pdfplumber local, llamaparse for scans)"
readme = "SKILL.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "skale"},
]
dependencies = [
    "requests>=2.31.0",
    "credgoo",
]

[tool.uv.sources]
credgoo = { git = "https://github.com/devskale/python-openutils.git", subdirectory = "packages/credgoo" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.scripts]
pdf2md = "scripts.pdf2md:main"
